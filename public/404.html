<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
// URL reconstruction (no useless prefixes): the English edition moved from /en/* to the root.
// One redirect handles every legacy URL; /bg/ and /gla/ stay as real locales.
(function () {
  var p = location.pathname;
  if (p === '/en' || p === '/en/') { location.replace('/' + location.search + location.hash); return; }
  if (p.indexOf('/en/') === 0) { location.replace(p.slice(3) + location.search + location.hash); return; }
  document.getElementById && document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('msg');
    if (el) el.textContent = 'Page not found — ';
  });
})();
</script>
<meta name="robots" content="noindex">
<style>body{font-family:Georgia,serif;display:grid;place-items:center;min-height:90vh}a{color:inherit}</style>
</head>
<body>
<p><span id="msg">Redirecting… </span><a href="/">go to the portal home</a>.</p>
</body>
</html>
