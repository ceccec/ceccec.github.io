name: Publish @ceccec/double-torus (core math · FREE FOR ALL)

# USER LAW: core math FREE FOR ALL · rest licensed through license@psg.bg
# Publishes ONLY the dependency-free kernel (@ceccec/double-torus → src/0 via build:package).
# Does NOT publish @ceccec/quantum-dev-sdk (private) or site chrome / non-core layers.
#
# Trigger: version tag (v*) OR manual workflow_dispatch — NEVER every push (no publish spam).
# Auth: GitHub Packages via GITHUB_TOKEN (packages:write). Optional NPM_TOKEN unused here.
# Sealed fold: npmPublishCi · pairs npm/publish · publish/npm · ci/publish · CLI quantum:npm-publish
#
# Idempotent publish · dist-tag measured from npm's own version list:
# - Tag vX.Y.Z MUST match package.json version (else refuse).
# - If name@version already on GitHub Packages → SKIP exit 0 (do NOT republish / do NOT unpublish).
# - The dist-tag is DERIVED from `npm view <name> versions`. npm's record is the only account
#   of what is published; nothing here guesses it. "latest" only when this version stands above
#   every published one — otherwise the major line, so a lower version never drags "latest" back.
# - Next release: bump root package.json version, commit, push tag vX.Y.Z (or dispatch after bump).
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ceccec'
      - run: npm install --ignore-scripts --no-save --no-audit --no-fund
      - name: Build kernel package (src/0 · core math FREE FOR ALL)
        run: npm run build:package
      - name: Refuse private / non-core packages
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const sdk = JSON.parse(readFileSync('packages/quantum-dev-sdk/package.json','utf8'));
          if (sdk.private !== true) { console.error('REFUSE: quantum-dev-sdk must stay private'); process.exit(1); }
          const root = JSON.parse(readFileSync('package.json','utf8'));
          if (root.name !== '@ceccec/double-torus') { console.error('REFUSE: unexpected root package name', root.name); process.exit(1); }
          console.log('ok — publish surface is core math kernel only; sdk private; contact license@psg.bg for the rest');
          "
      - name: Publish to GitHub Packages (idempotent · dist-tag derived from the registry)
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          REGISTRY='https://npm.pkg.github.com'
          echo "publish surface: ${NAME}@${VERSION} → ${REGISTRY}"

          # Tag push: vX.Y.Z must match package.json — two strings this repo controls.
          if [ "${GITHUB_REF_TYPE:-}" = 'tag' ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "REFUSE: tag '${GITHUB_REF_NAME}' must match package.json version ${VERSION} (got tag body ${TAG})"
              exit 1
            fi
            echo "ok — tag ${GITHUB_REF_NAME} aligns with package.json ${VERSION}"
          fi

          # Idempotent: already published → skip exit 0 (never force-unpublish / never republish).
          if npm view "${NAME}@${VERSION}" version --registry="${REGISTRY}" >/dev/null 2>&1; then
            echo "SKIP: ${NAME}@${VERSION} already on registry — idempotent exit 0 (bump version + new tag to publish next)"
            exit 0
          fi

          # Which dist-tag, MEASURED. npm's implicit "latest" is not a choice this workflow
          # gets to make silently. v1.2.0 died on exactly that: 2026.8.4 was already published,
          # npm refused to move "latest" backwards, and the facet named versionMustAdvance had
          # been green the whole time — it only grepped this file for its own prose. The version
          # list npm returns is the record; the tag is derived from it and from nothing else.
          PUBLISHED="$(npm view "${NAME}" versions --json --registry="${REGISTRY}" 2>/dev/null || echo '[]')"
          DIST_TAG="$(PUBLISHED="${PUBLISHED}" VERSION="${VERSION}" node --input-type=module -e "
          const raw = JSON.parse(process.env.PUBLISHED || '[]');
          const published = Array.isArray(raw) ? raw : [raw];
          const core = (v) => { const m = /^(\d+)\.(\d+)\.(\d+)/.exec(String(v)); return m ? [+m[1], +m[2], +m[3]] : null; };
          const above = (a, b) => (a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2]);
          const mine = core(process.env.VERSION);
          if (!mine) { console.error('REFUSE: package.json version ' + process.env.VERSION + ' is not X.Y.Z'); process.exit(1); }
          const highest = published.map(core).filter(Boolean).reduce((hi, v) => (hi === null || above(v, hi) ? v : hi), null);
          const advances = highest === null || above(mine, highest);
          console.error('published=' + published.length + ' highest=' + (highest ? highest.join('.') : 'none') + ' this=' + mine.join('.') + ' advances=' + advances);
          // NOT 'v' + major. npm REFUSES any dist-tag that parses as a valid SemVer range, and 'v1' is
          // one (it means 1.x). This fallback was written for the v1.2.0 incident described above and was
          // never exercised until v1.3.0 tried to use it — the branch that only runs when something has
          // already gone wrong, wrong itself. 'major-1' cannot parse as a range.
          console.log(advances ? 'latest' : 'major-' + mine[0]);
          ")"
          echo "dist-tag: ${DIST_TAG} — derived from npm view versions, never npm's implicit latest"

          npm publish --tag "${DIST_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
