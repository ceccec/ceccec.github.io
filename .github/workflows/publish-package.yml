name: Publish @ceccec/double-torus to GitHub Packages

# USER-TRIGGERED: push a version tag (e.g. v0.1.0) or run manually. Never auto-publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ceccec'
      - run: npm install --ignore-scripts --no-save --no-audit --no-fund
      - run: npm run build:package
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
