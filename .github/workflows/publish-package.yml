name: Publish @ceccec/double-torus (core math · FREE FOR ALL)

# USER LAW: core math FREE FOR ALL · rest licensed through license@psg.bg
# Publishes ONLY the dependency-free kernel (@ceccec/double-torus → src/0 via build:package).
# Does NOT publish @ceccec/quantum-dev-sdk (private) or site chrome / non-core layers.
#
# Trigger: version tag (v*) OR manual workflow_dispatch — NEVER every push (no publish spam).
# Auth: GitHub Packages via GITHUB_TOKEN (packages:write). Optional NPM_TOKEN unused here.
# Sealed fold: npmPublishCi · pairs npm/publish · publish/npm · ci/publish · CLI quantum:npm-publish
#
# Idempotent publish · dist-tag measured from npm's own version list:
# - Tag vX.Y.Z MUST match package.json version (else refuse).
# - If name@version already on GitHub Packages → SKIP exit 0 (do NOT republish / do NOT unpublish).
# - The dist-tag is DERIVED from `npm view <name> versions`. npm's record is the only account
#   of what is published; nothing here guesses it. "latest" only when this version stands above
#   every published one — otherwise the major line, so a lower version never drags "latest" back.
# - Next release: bump root package.json version, commit, push tag vX.Y.Z (or dispatch after bump).
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The live-release check reads git tags, and a shallow checkout has none — it would report
          # every published version as untagged and call the release incomplete.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ceccec'
      - run: npm install --ignore-scripts --no-save --no-audit --no-fund
      - name: Build kernel package (src/0 · core math FREE FOR ALL)
        run: npm run build:package
      - name: Refuse private / non-core packages
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const sdk = JSON.parse(readFileSync('packages/quantum-dev-sdk/package.json','utf8'));
          if (sdk.private !== true) { console.error('REFUSE: quantum-dev-sdk must stay private'); process.exit(1); }
          const root = JSON.parse(readFileSync('package.json','utf8'));
          if (root.name !== '@ceccec/double-torus') { console.error('REFUSE: unexpected root package name', root.name); process.exit(1); }
          console.log('ok — publish surface is core math kernel only; sdk private; contact license@psg.bg for the rest');
          "
      # THE PUBLISH-TIME GATE, IN FRONT OF THE PUBLISH. It was written for exactly this moment and ran
      # nowhere: not here, not in land, not in a nightly. Seven steps that only fail at publish time —
      # the Pages build verify:all never runs, the declaration graph that shipped 1.4.0 with four modules
      # missing, the tarball contents, the dependency claims. Measured 7/7 green before wiring, so this
      # blocks nothing that works and refuses the two failures this repository has actually had.
      - name: Refuse to publish a tree that fails the publish-time gate
        run: npm run verify:release

      - name: Publish to GitHub Packages (idempotent · dist-tag derived from the registry)
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          REGISTRY='https://npm.pkg.github.com'
          echo "publish surface: ${NAME}@${VERSION} → ${REGISTRY}"

          # Tag push: vX.Y.Z must match package.json — two strings this repo controls.
          if [ "${GITHUB_REF_TYPE:-}" = 'tag' ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "REFUSE: tag '${GITHUB_REF_NAME}' must match package.json version ${VERSION} (got tag body ${TAG})"
              exit 1
            fi
            echo "ok — tag ${GITHUB_REF_NAME} aligns with package.json ${VERSION}"
          fi

          # Idempotent: already published → skip exit 0 (never force-unpublish / never republish).
          if npm view "${NAME}@${VERSION}" version --registry="${REGISTRY}" >/dev/null 2>&1; then
            echo "SKIP: ${NAME}@${VERSION} already on registry — idempotent exit 0 (bump version + new tag to publish next)"
            exit 0
          fi

          # Which dist-tag, MEASURED. npm's implicit "latest" is not a choice this workflow
          # gets to make silently. v1.2.0 died on exactly that: 2026.8.4 was already published,
          # npm refused to move "latest" backwards, and the facet named versionMustAdvance had
          # been green the whole time — it only grepped this file for its own prose. The version
          # list npm returns is the record; the tag is derived from it and from nothing else.
          PUBLISHED="$(npm view "${NAME}" versions --json --registry="${REGISTRY}" 2>/dev/null || echo '[]')"
          DIST_TAG="$(PUBLISHED="${PUBLISHED}" VERSION="${VERSION}" node --input-type=module -e "
          const raw = JSON.parse(process.env.PUBLISHED || '[]');
          const published = Array.isArray(raw) ? raw : [raw];
          const core = (v) => { const m = /^(\d+)\.(\d+)\.(\d+)/.exec(String(v)); return m ? [+m[1], +m[2], +m[3]] : null; };
          const above = (a, b) => (a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2]);
          const mine = core(process.env.VERSION);
          if (!mine) { console.error('REFUSE: package.json version ' + process.env.VERSION + ' is not X.Y.Z'); process.exit(1); }
          const highest = published.map(core).filter(Boolean).reduce((hi, v) => (hi === null || above(v, hi) ? v : hi), null);
          const advances = highest === null || above(mine, highest);
          console.error('published=' + published.length + ' highest=' + (highest ? highest.join('.') : 'none') + ' this=' + mine.join('.') + ' advances=' + advances);
          // NOT 'v' + major. npm REFUSES any dist-tag that parses as a valid SemVer range, and 'v1' is
          // one (it means 1.x). This fallback was written for the v1.2.0 incident described above and was
          // never exercised until v1.3.0 tried to use it — the branch that only runs when something has
          // already gone wrong, wrong itself. 'major-1' cannot parse as a range.
          console.log(advances ? 'latest' : 'major-' + mine[0]);
          ")"
          echo "dist-tag: ${DIST_TAG} — derived from npm view versions, never npm's implicit latest"

          # THE PUBLISHED package.json IS WHAT A USER DOWNLOADS. The repo's own carries hundreds of scripts — measured at
          # half the tarball, larger than the kernel's code — and none of them runs for someone who installed the kernel.
          # Removed from this checkout's copy only, after the build and before the pack; the repo file is untouched.
          npm pkg delete scripts devDependencies
          npm publish --tag "${DIST_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # THE RELEASE IS NOT DONE WHEN THE TAG IS PUSHED — it is done when both permanent records hold it.
      # A tag fans out to this workflow and to zenodo-publish.yml and neither ever reported back, so the
      # repository could carry a version live in one record, in neither, or in both and no gate could tell
      # the three apart. This reads both registries and the archive and refuses a tagged version that is
      # missing from one. It also prints the LEADS: every disagreement between what this repo declares,
      # what git tagged and what the records hold is what the next release should answer.
      #
      # The publish step above deletes `scripts` from the CHECKOUT's package.json before packing, so the
      # file must come back before any npm run can find this gate again.
      - name: Confirm the release is live in both records, and read back the leads
        if: always()
        run: |
          set -euo pipefail
          git checkout -- package.json
          npm run verify:release-live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── THE THIRD PUBLISH SURFACE, WHICH HAD NO AUTOMATION AT ALL ────────────────────────────────────────────
  #
  # Measured 2026-09-26: this file was the ONLY publish workflow and it targets npm.pkg.github.com. No
  # NPM_TOKEN exists in any workflow — the secrets are GITHUB_TOKEN, GOOGLE_SITE_VERIFICATION and the two
  # Zenodo tokens. Yet registry.npmjs.org holds @ceccec/double-torus 1.4.0 (published 2026-07-22) and 1.5.0
  # (2026-09-13), so both reached npmjs BY HAND. Three surfaces, and only two of them were automated: a tag
  # wrote GitHub Packages and Zenodo, and somebody remembered npmjs or did not.
  #
  # NO TOKEN IS READ HERE, BY DESIGN. This uses npm trusted publishing: the runner's OIDC identity is the
  # credential, which is why the job asks for `id-token: write` and nothing else. If npmjs has not been told
  # to trust this workflow the publish fails saying so, and that refusal is the correct outcome — a missing
  # trust relationship is a thing to configure once, not a reason to paste a long-lived token into a secret.
  #
  # CONFIGURE ONCE, ON npmjs.com: package @ceccec/double-torus → Settings → Trusted publishers → add this
  # repository (ceccec/ceccec.github.io) and this workflow file (publish-package.yml). Until then this job
  # refuses and the version stays manual, which the release readiness matrix already reports as manual.
  npmjs-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --ignore-scripts --no-save --no-audit --no-fund
      - name: Build the npmjs package from its own build script
        run: npm run build --prefix packages/double-torus

      # THE TAG MUST MATCH THIS PACKAGE, NOT THE ROOT. The two share one name across two registries and their
      # versions have diverged before — the root said 1.5.0 while this said 1.6.0, which would have made a
      # v1.6.0 tag refuse in the job above while being correct here. Each surface checks its own manifest.
      - name: Refuse a tag that does not match packages/double-torus
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/double-torus/package.json').version")"
          if [ "${GITHUB_REF_TYPE:-}" = 'tag' ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "REFUSE: tag ${GITHUB_REF_NAME} does not match packages/double-torus ${VERSION}"
              exit 1
            fi
          fi
          echo "ok — publishing @ceccec/double-torus ${VERSION} to registry.npmjs.org"

      - name: Publish to npmjs (idempotent · provenance from the runner identity)
        run: |
          set -euo pipefail
          cd packages/double-torus
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          # Already there → skip exit 0. npmjs versions are immutable, so a re-run must be a no-op and not
          # an error; this is the same lesson the release workflow learned from HTTP 422 on an immutable release.
          if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "SKIP: ${NAME}@${VERSION} already on npmjs — idempotent exit 0"
            exit 0
          fi
          npm publish --access public --provenance
