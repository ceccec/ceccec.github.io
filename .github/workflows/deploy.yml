# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Deploy VitePress site to Pages

on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch.
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # delete stale github-pages artifacts on re-run (deploy-pages requires exactly one)

# One Pages deployment at a time; newer push cancels stale in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
      - name: Setup pnpm
        uses: pnpm/action-setup@v5 # version read from "packageManager" in package.json
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Restore build caches
        uses: actions/cache@v6
        with:
          path: |
            .vitepress/cache
            .vitepress/.temp
            .vitepress/cache/quantum-esbuild
            ~/.cache/node-compile
          key: vitepress-warm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vitepress-warm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build with VitePress
        run: pnpm run docs:build
        env:
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          QUANTUM_TIMEOUT_MS: '880000' # headroom only — the 3-minute law is enforced by optimization, measured per run
          # absolute path — env values do NOT shell-expand '~' (a literal ~/ dir in the workspace tripped the folder law)
          NODE_COMPILE_CACHE: /home/runner/.cache/node-compile
      - name: Remove stale Pages artifacts (re-run safety)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId },
            );
            for (const artifact of artifacts) {
              if (artifact.name !== 'github-pages') continue;
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted stale artifact ${artifact.id} (${artifact.name})`);
            }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deduplicate Pages artifacts (re-run / upload-retry safety)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId },
            );
            const pages = artifacts.filter((a) => a.name === 'github-pages');
            if (pages.length <= 1) {
              core.info(`Pages artifact count OK (${pages.length})`);
              return;
            }
            pages.sort(
              (a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime(),
            );
            core.warning(`Found ${pages.length} github-pages artifacts; keeping newest ${pages[0].id}`);
            for (const artifact of pages.slice(1)) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted duplicate artifact ${artifact.id}`);
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
