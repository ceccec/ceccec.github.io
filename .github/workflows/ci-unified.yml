name: Unified CI — All Environments

# One runner for every environment, on demand. Push-time deploy stays with deploy.yml and
# waves-after-push.yml; tag-time publishing stays with publish-package.yml and
# zenodo-publish.yml, both gated by release-cut (cut on green only). This workflow never
# publishes: a tag fires npm AND an immutable DOI, so publishing is not re-implemented here.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, staging, production]
        default: production
      deploy:
        description: 'Also deploy the built site to Pages (production only)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Core verifications
        run: |
          npm run verify:structure
          npm run verify:imports
          npm run verify:barrel
          npm run verify:paths
          npm run verify:theorems
      - name: Full verification suite (production only)
        if: inputs.environment == 'production'
        run: npm run verify:all

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run docs:build
      - run: npm run build:package
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: .vitepress/dist
          retention-days: 1

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    if: inputs.environment == 'production' && inputs.deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: .vitepress/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  waves:
    runs-on: ubuntu-latest
    needs: build
    if: inputs.environment == 'production'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run quantum:wave-verify

  status:
    runs-on: ubuntu-latest
    needs: [verify, build, deploy-pages, waves]
    if: always()
    steps:
      - run: |
          echo "environment: ${{ inputs.environment }}  deploy: ${{ inputs.deploy }}"
          for job in verify build; do
            r="${{ needs.verify.result }}"; [ "$job" = build ] && r="${{ needs.build.result }}"
            [ "$r" = success ] || { echo "$job: $r"; exit 1; }
          done
          echo "ok for ${{ inputs.environment }}"
