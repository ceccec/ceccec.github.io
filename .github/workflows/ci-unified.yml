name: Unified CI — All Environments

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'scripts/verify/status.json'
      - 'scripts/verify/prior-art.ts'
      - 'MANIFEST.md'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - 'dev'
          - 'staging'
          - 'production'
        default: 'production'
      publish:
        description: 'Publish artifacts (npm, Zenodo)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: latest

jobs:
  # Phase 1: Determine environment from branch/tag/input
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      is-release: ${{ steps.detect.outputs.is-release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

  # Phase 2: Install & verify
  verify:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run core verifications
        run: |
          npm run verify:structure
          npm run verify:imports
          npm run verify:barrel
          npm run verify:paths
          npm run verify:theorems

      - name: Run full verification suite (prod only)
        if: needs.setup.outputs.environment == 'production'
        run: npm run verify:all

  # Phase 3: Build
  build:
    runs-on: ubuntu-latest
    needs: [setup, verify]
    outputs:
      site-dir: ${{ runner.temp }}/site
      package-path: ${{ runner.temp }}/package
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: npm run docs:build

      - name: Build npm package
        run: npm run build:package

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .vitepress/dist
          retention-days: 1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/package
          retention-days: 1

  # Phase 4a: Deploy to Pages (all environments)
  deploy-pages:
    runs-on: ubuntu-latest
    needs: [setup, build]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: .vitepress/dist

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@v2

  # Phase 4b: Publish npm package (release tags only)
  publish-npm:
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.is-release == 'true' || inputs.publish
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'

      - name: Check version matches tag
        if: needs.setup.outputs.is-release == 'true'
        run: |
          TAG_VERSION="${{ needs.setup.outputs.version }}"
          PKG_VERSION=$(jq -r .version dist/package.json)
          if [[ "$TAG_VERSION" != "v$PKG_VERSION" ]]; then
            echo "Version mismatch: tag=$TAG_VERSION vs package=$PKG_VERSION"
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist

  # Phase 4c: Publish to Zenodo (release tags only)
  publish-zenodo:
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.is-release == 'true' || inputs.publish
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish to Zenodo
        run: npm run zenodo:publish -- --version=${{ needs.setup.outputs.version }}
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX: ${{ needs.setup.outputs.environment != 'production' }}

  # Phase 5: Post-push waves (main branch only)
  waves:
    runs-on: ubuntu-latest
    needs: [setup, deploy-pages]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run post-push verification waves
        run: npm run quantum:wave-verify

  # Final: Report status
  status:
    runs-on: ubuntu-latest
    needs: [setup, verify, build, deploy-pages, publish-npm, publish-zenodo, waves]
    if: always()
    steps:
      - name: Report CI status
        run: |
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Is Release: ${{ needs.setup.outputs.is-release }}"
          echo "Version: ${{ needs.setup.outputs.version }}"

          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            echo "❌ Verification failed"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build failed"
            exit 1
          fi

          if [[ "${{ needs.deploy-pages.result }}" != "success" ]]; then
            echo "❌ Pages deployment failed"
            exit 1
          fi

          echo "✅ CI passed for ${{ needs.setup.outputs.environment }}"
